[package]
name = "ccl"
version = "1.0.0"
description = "Cwj Craft Launcher"
authors = ["Jeremy Cai"]
edition = "2021"
rust-version = "1.80"

# Tauri 2 标准结构：lib 供桌面 exe 与 Android so 共用
[lib]
name = "ccl_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 本地插件：Android 存储权限（MANAGE_EXTERNAL_STORAGE）申请与检测
ccl-android = { path = "plugins/ccl-android" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 跨平台 TLS：rustls 纯 Rust 实现（native-tls 依赖系统 OpenSSL，Android 不可用）
# socks 特性：支持走系统 SOCKS5 代理（Clash mixed 端口），国内下载 GitHub 资产必需
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "socks"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
percent-encoding = "2"
# Android JRE 解包：xz + tar 纯 Rust 实现（不依赖 liblzma / NDK C 工具链）
lzma-rs = "0.3"
tar = "0.4"

# 内嵌 JVM（Android）：只取 JavaVM/JNIEnv 的类型封装。
# 不开 invocation feature —— 那会在链接期要求 libjvm 存在，
# 而我们是运行时 dlopen 拿 JNI_CreateJavaVM 函数指针。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
codegen-units = 16
lto = false
panic = "unwind"
strip = true
