[package]
name = "ccl"
version = "1.0.0"
description = "Cwj Craft Launcher"
authors = ["Jeremy Cai"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "charset", "socks"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 16
lto = false
panic = "unwind"
strip = true
