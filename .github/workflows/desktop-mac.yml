name: Build Desktop (macOS)

# 在 macOS runner 上原生构建 CCL 桌面端。
# 为什么必须用 mac runner：node_datachannel 是原生模块，
# 在 Windows 上交叉打包出的 .node 在 mac 上加载会直接崩。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支或 tag（留空=当前分支）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-11-02 起 GitHub 退役了 macos-13/macos-14，
          # 现役 Intel 镜像是 macos-15-intel，Apple Silicon 是 macos-15。
          - os: macos-15-intel # Intel x64
            arch: x64
          - os: macos-15 # Apple Silicon
            arch: arm64
    defaults:
      run:
        working-directory: desktop
    env:
      # 把 Electron / electron-builder 的下载缓存放进工作区，
      # 这样 actions/cache 在三个平台上用同一个 path 就行。
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # 没有 Apple 开发者证书，显式关闭签名自动探测
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # node-gyp 在 macOS 自带的 Python 3.12+ 上需要这两个包
      - name: Fix node-gyp Python
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-${{ hashFiles('desktop/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm run --prefix xmcl-keystone-ui build

      - name: Package dmg
        env:
          RELEASE: 'true'
          NODE_ENV: production
          CCL_PLATFORM: mac
          CCL_ARCH: ${{ matrix.arch }}
        run: pnpm run --prefix xmcl-electron-app build

      - name: Show artifacts
        run: ls -lh xmcl-electron-app/build/output/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ccl-macos-${{ matrix.arch }}
          path: desktop/xmcl-electron-app/build/output/*.dmg
          if-no-files-found: error
          retention-days: 30

      # tag 推上来时顺手挂到对应的 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            xmcl-electron-app/build/output/*.dmg \
            --clobber || gh release create "${GITHUB_REF_NAME}" \
            xmcl-electron-app/build/output/*.dmg --title "CCL ${GITHUB_REF_NAME}" --generate-notes
